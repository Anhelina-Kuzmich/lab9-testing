name: CI

on:
  push:
    branches: ["**"]

jobs:
  build:
    name: Build (syntax check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Run Build
        run: npm run build

  unit-tests:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: package.json

  integration-tests:
    name: Integration tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Run Integration Tests
        run: npm run test:integration

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: package.json

  api-tests:
    name: API tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Run API Tests
        run: npm run test:api

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: package.json
